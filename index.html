<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f2f4;--sf:#fff;--tx:#1f2328;--mu:#69707a;--ln:#e6e8eb;--ac:#b8502a;--ac2:#fbece5;--ok:#1b8a4b;--bad:#c62828}

:root[data-theme="dark"]{--bg:#101113;--sf:#1a1b1e;--tx:#ececee;--mu:#9a9ea6;--ln:#2a2c30;--ac:#e8896b;--ac2:#35231c;--ok:#6fcf97;--bad:#f2867f}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);padding:8px 12px;border-bottom:1px solid var(--ln)}
.hrow{display:flex;align-items:center;gap:10px}
.logo,.ib{border:0;background:none;padding:2px;display:grid;place-items:center;position:relative}

.bd{position:absolute;top:0;right:0;background:var(--ac);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.sbar{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:10px;padding:0 10px;background:var(--bg);color:var(--mu)}

.ttl{font-size:16px}
.pad{padding:12px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:10px 12px 0;border-radius:12px}
.car::-webkit-scrollbar{display:none}

.slide b{font-size:19px}.slide span{opacity:.92}

.lk{border:0;background:none;color:var(--ac);font-size:13px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:0 12px 4px;scrollbar-width:none}.strip .card{flex:0 0 138px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:0 0 8px;text-align:left;overflow:hidden;display:block;width:100%}

.p{font-weight:700;font-size:15px;margin-top:3px}.mu{color:var(--mu);font-size:12px}.lo{color:var(--bad);font-size:11px}
.dc s{color:var(--mu);font-size:12px}.ad{background:#fde7ea;color:#c62828;font-weight:700;font-size:11px;border-radius:4px;padding:0 5px;margin-right:4px}

.pp{font-size:22px;font-weight:700}.pt{font-size:16px;font-weight:500;margin:4px 0}

.nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:25}
.nav button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--mu);font-size:11px;display:grid;justify-items:center;gap:2px;position:relative}
.nav button[aria-current=true]{color:var(--ac)}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 8px;align-items:center}
.step{display:flex;gap:3px;margin:8px 0}.step i{flex:1;height:4px;border-radius:2px;background:var(--ln)}.step i.on{background:var(--ac)}
.st{font-weight:600;text-transform:capitalize}.st.rto,.st.returned,.st.cancelled{color:var(--bad)}.st.delivered{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 12px}
.stats div{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px}.stats b{display:block;font-size:16px}
.bar{display:grid;grid-template-columns:100px 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:12px}.bar i{height:8px;background:var(--ac);border-radius:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mini input,.mini select{width:78px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;max-width:90vw;z-index:50}
#splash{position:fixed;inset:0;z-index:99;background:#cc6a48;display:grid;place-content:center;justify-items:center;gap:12px;transition:opacity .4s}
#splash.out{opacity:0;pointer-events:none}#splash svg{width:140px;height:140px}
.sp{fill:none;stroke:#fff;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:dr 1s ease forwards}
.sp-w{color:#fff;font:700 36px system-ui,sans-serif;letter-spacing:-.03em;opacity:0;animation:fi .5s 1.3s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sp{animation:none;stroke-dashoffset:0}.sp-w{animation:none;opacity:1}}
.sk{background:linear-gradient(90deg,var(--sf) 25%,var(--ln) 50%,var(--sf) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border:0;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
a.sec{text-decoration:none;display:inline-block;color:var(--tx)}
</style>
</head>

<script>

addEventListener("error", e => { window.__err = e.message; });
setTimeout(() => { const s = document.getElementById("splash"); if (s && window.__err) { s.remove(); document.getElementById("app").innerHTML = '<p style="padding:16px">Something went wrong loading Sokio: ' + String(window.__err).replace(/</g, "&lt;") + '</p>'; } }, 4000);
</script>
<script>
// ===== Config =====
const SB_URL = "https://qzgkxxregkuiaprufysl.supabase.co", SB_KEY = "sb_publishable_yDqNvJAjr9THzxZ6J4s6Fg_LFt39FpS"; // Supabase project URL + publishable key (safe in the browser). Products, banners and categories load from here.
let sb = null; try { if (SB_URL && SB_KEY && window.supabase) sb = supabase.createClient(SB_URL, SB_KEY); } catch (_) {}
// Admin mobile numbers (254XXXXXXXXX). Must match is_admin() in supabase.sql.

const BR = "#cc6a48", SPARK = 'M255.8 316.0L252.8 230.1 M259.3 317.0L295.2 261.6 M261.0 318.7L329.8 274.1 M262.0 322.2L322.0 324.3 M261.3 324.8L339.0 366.1 M258.7 327.3L287.8 384.4 M256.3 328.0L260.7 411.9 M252.8 327.1L216.8 384.8 M250.9 325.2L183.1 367.6 M250.0 321.7L188.1 318.4 M250.7 319.3L174.0 280.2 M253.2 316.7L222.2 258.4';

const LOGO = `<svg viewBox="0 0 512 512" width="34" height="34" aria-hidden="true"><rect width="512" height="512" rx="112" fill="${BR}"/>${BAG}</svg>`;
const IC = {home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',cart:'<path d="M3 4h2l2.2 11h11l2-8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/>',orders:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',admin:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const ic = n => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

// ===== Products: loaded from Supabase (products table), nothing is hard-coded here =====
let P = [];
const pr = id => P.find(p => p.id === id);
const sale = p => p.disc > 0 ? Math.round(p.price * (1 - p.disc / 100)) : p.price; // promoted = discount above 0
const maxPrice = () => Math.max(100, Math.ceil(Math.max(0, ...P.map(sale)) / 50) * 50); // price slider ceiling follows the catalogue

// ===== State =====
let ACC = LS("bz_acc") || {};
const S = {view:"home",prev:"home",q:"",cat:"All",max:0,r4:false,sort:"rel",pid:null,cart:[],orders:[],hist:LS("sk_hist")||[],user:LS("bz_user"),uid:null,mode:"in",back:null,rf:[],prof:null,adm:false,nid:1001,
  cfg:{refReward:50},banners:[],isA:false,costs:{},ocost:{},coupons:[],cps:[],cp:null,coupon:"",at:"Overview",ep:null,pq:"",oq:"",dirtyP:new Set(),dirtyB:false,dirtyR:false};
if (!ACC[S.user]) S.user = null; else S.prof = ACC[S.user].prof || null;
let CO = {}; // "customers also bought" strength per product, from Supabase also_bought()
const isAdm = () => !!S.isA; // decided by the database (admins table)
const svc = p => /^\d{5}$/.test(p) && p[0] !== "9"; // 5-digit Kenyan postcode; starting with 9 = not serviceable (demo)

const nm = m => { const x = /^(?:\+?254|0)([17]\d{8})$/.exec(String(m).replace(/[\s-]/g, "")); return x ? "254" + x[1] : null; };

// ===== Catalogue: categories, products and banners from Supabase =====
const rowP = r => ({id:r.id, title:r.title, category:r.category, image:r.emoji || "📦", img:r.img_url || "", price:r.price, stock:r.stock,
  sizes:r.sizes && r.sizes.length ? r.sizes : ["Standard"], rating:+r.rating, rc:r.rating_count, disc:r.discount, hidden:r.hidden, sort:r.sort_order, farmer:r.farmer || "", loc:r.location || "", season:r.season || []});
S.wish = LS("sk_wish") || []; S.pst = []; S.bundles = []; S.pts = []; S.subs = []; S.nt = []; S.ly = null; S.dv = {min:0, tiers:[[0,200],[500,120],[1000,0]]};
const rowB = r => ({id:r.id, t:r.title, s:r.subtitle, img:r.img_url || "", cat:r.target, c:r.color});

function applyCatalog(d) { CATS = {}; (d.c || []).forEach(c => CATS[c.name] = [c.color, c.emoji]);
  P = (d.p || []).map(rowP); S.banners = (d.b || []).map(rowB); S.cfg.refReward = d.r != null ? +d.r : 50; S.cps = d.k || []; }
const dirtyN = () => S.dirtyP.size + (S.dirtyB ? 1 : 0) + (S.dirtyR ? 1 : 0);
async function loadCatalog() {
  if (!sb) { if (!loaded) { loadErr = "The shop is not connected. Add SB_URL and SB_KEY in index.html."; render(); } return; }
  if (dirtyN()) return; // never overwrite unsaved admin edits
  try {
    const [c, p, b, s, k] = await Promise.all([sb.from("categories").select("*").order("sort_order"),
      sb.from("products").select("*").order("sort_order").order("created_at"), sb.from("banners").select("*").order("sort_order"),
      sb.from("settings").select("value").eq("key", "cfg").maybeSingle(), sb.from("coupons").select("code,kind,value,min_order,ends_at").eq("public", true).eq("active", true).gt("ends_at", new Date().toISOString())]);
    const e = c.error || p.error || b.error; if (e) throw e;
    const d = {c:c.data, p:p.data, b:b.data, r:s.data && s.data.value ? s.data.value.refReward : null, k:k.data || []}, sig = JSON.stringify(d);
    loadErr = ""; if (loaded && sig === lastSig) return; lastSig = sig; applyCatalog(d); loaded = true; LS("sk_cat", d);
  } catch (e) { if (!loaded) loadErr = /does not exist|schema cache/i.test(e.message || "") ? "The shop tables are missing. Run supabase.sql in your Supabase SQL Editor." : (e.message || "Could not load the shop."); }
  render(); }
async function saveAll() {
  if (!sb) return toast("Not connected to Supabase");
  const rows = P.filter(p => S.dirtyP.has(p.id)).map(p => ({id:p.id, title:p.title, category:p.category, emoji:p.image, img_url:p.img || "", price:p.price, stock:p.stock, sizes:p.sizes, discount:p.disc, hidden:p.hidden, sort_order:p.sort || 0, farmer:p.farmer || "", location:p.loc || "", season:p.season || []})), jobs = [];
  if (rows.length) jobs.push(sb.from("products").upsert(rows));
  if (S.dirtyB) jobs.push(sb.rpc("save_banners", {items:S.banners}));
  if (S.dirtyR) jobs.push(sb.from("settings").upsert({key:"cfg", value:{refReward:S.cfg.refReward}}));
  if (!jobs.length) return toast("Nothing to save");
  const bad = (await Promise.all(jobs)).find(r => r.error); if (bad) return toast("Save failed: " + bad.error.message);
  S.dirtyP.clear(); S.dirtyB = S.dirtyR = false; lastSig = ""; await loadCatalog(); toast("Saved for everyone"); }
const cached = LS("sk_cat"); if (cached && cached.p) { applyCatalog(cached); loaded = true; lastSig = JSON.stringify(cached); } // instant start, refreshed from Supabase below
const loadView = () => loadErr ? `<div class="box"><b>Can’t load the shop</b><p class="mu">${esc(loadErr)}</p><button class="pri" data-a="retry">Try again</button></div>`
  : `<div class="car"><div class="slide sk" style="min-height:130px"></div></div><div class="grid" style="margin-top:14px">${'<div class="card sk" style="height:215px"></div>'.repeat(6)}</div>`;

// ===== Admin data, coupons, countdowns =====
const ocs = o => S.ocost[o.uid + "|" + o.id] ?? o.items.reduce((a, i) => a + i.qty * (S.costs[i.pid] || 0), 0); // order cost: snapshot, else current buying prices

  if (S.isA) { const [c, o, k] = await Promise.all([sb.from("product_costs").select("*"), sb.from("order_costs").select("*"), sb.from("coupons").select("*").order("ends_at", {ascending:false})]);
    S.costs = {}; (c.data || []).forEach(x => S.costs[x.pid] = x.cost); S.ocost = {}; (o.data || []).forEach(x => S.ocost[x.user_id + "|" + x.order_no] = x.cost); S.coupons = k.data || []; S.team = ((await sb.from("admins").select("phone")).data || []).map(x => x.phone); }
  render(); }
async function sv(p, ok) { const r = await p; if (r && r.error) return toast(/foreign key/i.test(r.error.message) ? "Move or delete its products first" : r.error.message); S.ep = null; lastSig = ""; await loadCatalog(); await loadAdmin(); await loadExtra(); toast(ok); }
const cpTxt = c => (c.kind === "percent" ? c.value + "% off" : R(c.value) + " off") + (c.min_order ? " over " + R(c.min_order) : "");
